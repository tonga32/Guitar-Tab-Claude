<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Audio a Tablatura</title>
<style>
:root{--bg:#14161a;--card:#1e2128;--tx:#e8e8ea;--ac:#f5a524;--mu:#8b8f99}
*{box-sizing:border-box}
body{margin:0 auto;font-family:system-ui,sans-serif;background:var(--bg);color:var(--tx);padding:16px;max-width:1100px}
h1{font-size:1.4rem;margin:.2em 0}
.card{background:var(--card);border-radius:12px;padding:14px;margin:12px 0}
button{background:var(--ac);color:#000;border:0;border-radius:8px;padding:10px 16px;font-weight:700;cursor:pointer;margin:4px 4px 4px 0}
button:disabled{opacity:.4;cursor:default}
label{display:block;margin:8px 0;color:var(--mu);font-size:.9rem}
input[type=range]{width:220px;vertical-align:middle}
input[type=number],select{background:#2a2e37;color:var(--tx);border:1px solid #444;border-radius:6px;padding:6px}
input[type=number]{width:110px}
#estado{color:var(--mu);margin-top:8px}
progress{width:100%;height:10px}
small{color:var(--mu)}
/* tablatura */
#tab{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-start}
.compas{display:flex;flex-direction:column;border-left:2px solid #888;padding-left:4px}
.num{color:var(--mu);font-size:.7rem}
.fila2{display:flex;font-family:monospace}
.cuerdas{display:flex;flex-direction:column;color:var(--mu);padding-right:4px}
.cuerdas span{height:20px;line-height:20px}
.col{display:flex;flex-direction:column;align-items:center;border-radius:4px}
.col span{height:20px;line-height:20px;width:100%;text-align:center;background:linear-gradient(transparent 9px,#666 9px,#666 10px,transparent 10px)}
.col.on{background:var(--ac)}
.col.on span{color:#000;font-weight:700}
.ritmo{position:relative;height:30px;width:100%;color:var(--tx)}
.col.on .ritmo{color:#000}
.tallo{position:absolute;left:50%;top:2px;height:18px;border-left:2px solid currentColor}
.hueca::after{content:"";position:absolute;left:-6px;bottom:-3px;width:8px;height:6px;border:2px solid currentColor;border-radius:50%}
.banda{position:absolute;left:50%;height:3px;width:9px;background:currentColor}
.redonda{position:absolute;left:calc(50% - 6px);top:6px;width:12px;height:8px;border:2px solid currentColor;border-radius:50%}
.ritmo b{position:absolute;left:calc(50% + 5px);top:12px;font-size:14px;line-height:1}
.silencio{opacity:.35}
</style>
</head>
<body>
<h1>🎸 Audio a Tablatura</h1>
<small>Todo se procesa en tu navegador. No se sube nada a ningún servidor.</small>

<div class="card">
  <input type="file" id="archivo" accept="audio/*">
  <label>Cómo aislar la guitarra
    <select id="metodo">
      <option value="rapido">Rápido y liviano (aproximado)</option>
      <option value="preciso">Preciso y lento (Demucs, baja ~136 MB)</option>
      <option value="ninguno">Ninguno (el audio ya es solo guitarra)</option>
    </select></label>
  <label>Ignorar notas más graves que
    <select id="grave">
      <option value="40">Mi grave (E2) — usar todas</option>
      <option value="45">La (A2)</option>
      <option value="50">Re (D3)</option>
      <option value="55">Sol (G3)</option>
    </select></label>
  <label>Sensibilidad (más a la derecha = más notas)
    <input type="range" id="sens" min="10" max="60" value="30"></label>
  <label>Largo mínimo de nota (ms)
    <input type="range" id="minlen" min="30" max="300" value="70"></label>
  <button id="btnTrans" disabled>Transcribir</button>
  <button id="btnCancel" hidden style="background:#666;color:#fff">Cancelar</button>
  <progress id="prog" value="0" max="1" hidden></progress>
  <div id="estado">Elige un archivo de audio.</div>
  <audio id="stem" controls hidden style="width:100%;margin-top:8px"></audio>
</div>

<div class="card">
  <label>Tempo (BPM) — vacío = automático
    <input type="number" id="bpm" min="40" max="220" placeholder="auto"></label>
  <label>Compás
    <select id="comp">
      <option value="16">4/4</option>
      <option value="12">3/4</option>
      <option value="8">2/4</option>
    </select></label>
  <small>Si el ritmo sale raro, escribe el tempo a mano (o la mitad / el doble del detectado).</small>
</div>

<div class="card">
  <button id="btnPlay" disabled>▶ Reproducir</button>
  <button id="btnStop" disabled>■ Detener</button>
  <button id="btnMidi" disabled>⬇ Descargar .mid</button>
</div>

<div class="card"><div id="tab">La tablatura aparecerá aquí.</div></div>

<script type="module">
import { BasicPitch, noteFramesToTime, addPitchBendsToNoteEvents, outputToNotesPoly }
  from "https://esm.sh/@spotify/basic-pitch@1.0.1";

const MODEL = "https://cdn.jsdelivr.net/npm/@spotify/basic-pitch@1.0.1/model/model.json";
const MODELO = "https://huggingface.co/StemSplitio/htdemucs-6s-onnx/resolve/main/htdemucs_6s_fp16weights.onnx";
const ORT = "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/";
const AFINACION = [40,45,50,55,59,64]; // E2 A2 D3 G3 B3 E4 (índice 0 = cuerda más grave)
const NOMBRES = ["e","B","G","D","A","E"];
const $ = id => document.getElementById(id);
let dec = null, cancelar = false, stemUrl = null;
let eventos = [], notasFinal = [], ultimo = null, actx = null, timers = [];

let ortAbortado = false;
function msgError(e) {
  if (e && e.message && /abort|out of memory|memory/i.test(e.message)) {
    ortAbortado = true; sessDemucs = null;
    $("metodo").value = "rapido";
    return "El motor de separación se detuvo, casi seguro porque al navegador se le acabó la memoria. " +
      "Recarga la página (F5) y prueba el modo Preciso una sola vez, sin usar otras pestañas pesadas. " +
      "Si vuelve a pasar, este equipo no tiene memoria suficiente para ese modo: usa el Rápido (ya lo dejé seleccionado).";
  }
  if (e && e.message) return "Error: " + e.message;
  if (typeof e === "string" && e) return "Error: " + e;
  return "El separador se quedó sin memoria o se interrumpió. Recarga la página (F5) y vuelve a intentarlo. Si sigue pasando, usa el modo Rápido.";
}
window.addEventListener("error", e => { if (e.message) $("estado").textContent = "Error: " + e.message; });
window.addEventListener("unhandledrejection", e => { $("estado").textContent = msgError(e.reason); });

// ---------- Audio ----------
async function remuestrear(buf, rate, canales) {
  const off = new OfflineAudioContext(canales, Math.ceil(buf.duration * rate), rate);
  const src = off.createBufferSource(); src.buffer = buf; src.connect(off.destination); src.start();
  return off.startRendering();
}
async function filtrarAudio(buf) { // quita graves (bajo) y agudos (platillos)
  const off = new OfflineAudioContext(1, buf.length, buf.sampleRate);
  const src = off.createBufferSource(); src.buffer = buf;
  const hp = off.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 70;
  const lp = off.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 3000;
  src.connect(hp); hp.connect(lp); lp.connect(off.destination); src.start();
  return off.startRendering();
}
$("archivo").onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  $("estado").textContent = "Leyendo audio...";
  try {
    const ac = new (window.AudioContext || window.webkitAudioContext)();
    dec = await ac.decodeAudioData(await f.arrayBuffer());
    ac.close();
    $("estado").textContent = "Listo (" + dec.duration.toFixed(1) + " s). Pulsa Transcribir.";
    $("btnTrans").disabled = false;
  } catch (err) { $("estado").textContent = "No pude leer ese archivo: " + err.message; }
};
$("btnCancel").onclick = () => { cancelar = true; };

// ---------- Separación precisa (Demucs 6 stems) ----------
async function bajarModelo() {
  let cache = null;
  try {
    cache = await caches.open("demucs-modelo");
    const hit = await cache.match(MODELO);
    if (hit) return new Uint8Array(await hit.arrayBuffer());
  } catch (e) {}
  const r = await fetch(MODELO);
  if (!r.ok) throw new Error("No pude bajar el modelo (" + r.status + ")");
  const total = +r.headers.get("content-length") || 0;
  const rd = r.body.getReader(), partes = []; let got = 0;
  for (;;) {
    const { done, value } = await rd.read(); if (done) break;
    partes.push(value); got += value.length;
    if (cancelar) throw new Error("Cancelado");
    $("prog").value = total ? got / total : 0;
    $("estado").textContent = "Bajando el modelo de separación: " + (got / 1048576).toFixed(0) + " MB" +
      (total ? " de " + (total / 1048576).toFixed(0) : "") + " (solo la primera vez)";
  }
  const bytes = new Uint8Array(got); let o = 0;
  for (const p of partes) { bytes.set(p, o); o += p.length; }
  try { if (cache) await cache.put(MODELO, new Response(bytes.slice())); } catch (e) {}
  return bytes;
}
function wavBlob(L, R, sr) {
  const n = L.length, b = new ArrayBuffer(44 + n * 4), v = new DataView(b);
  const str = (o, t) => { for (let k = 0; k < t.length; k++) v.setUint8(o + k, t.charCodeAt(k)); };
  str(0, "RIFF"); v.setUint32(4, 36 + n * 4, true); str(8, "WAVEfmt ");
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 2, true);
  v.setUint32(24, sr, true); v.setUint32(28, sr * 4, true); v.setUint16(32, 4, true); v.setUint16(34, 16, true);
  str(36, "data"); v.setUint32(40, n * 4, true);
  const c = x => Math.max(-1, Math.min(1, x)) * 32767;
  for (let i = 0; i < n; i++) { v.setInt16(44 + i * 4, c(L[i]), true); v.setInt16(46 + i * 4, c(R[i]), true); }
  return new Blob([b], { type: "audio/wav" });
}
let ortMod = null, sessDemucs = null;
async function obtenerSesion() {
  if (ortAbortado) throw new Error("Aborted: el motor ya se había detenido");
  if (sessDemucs) return sessDemucs; // se reutiliza: crearla otra vez gasta mucha memoria
  $("estado").textContent = "Preparando el separador...";
  ortMod = ortMod || await import(ORT + "ort.min.mjs");
  ortMod.env.wasm.wasmPaths = ORT;
  ortMod.env.wasm.numThreads = self.crossOriginIsolated ? Math.min(4, navigator.hardwareConcurrency || 2) : 1;
  let bytes = await bajarModelo();
  $("estado").textContent = "Cargando el modelo en memoria...";
  sessDemucs = await ortMod.InferenceSession.create(bytes, {
    executionProviders: ["wasm"], graphOptimizationLevel: "basic",
    enableCpuMemArena: false, enableMemPattern: false // menos memoria, algo más lento
  });
  bytes = null;
  return sessDemucs;
}
async function separarGuitarra() {
  const sess = await obtenerSesion();
  const ort = ortMod;
  const st = await remuestrear(dec, 44100, 2);
  const N = st.length, L = st.getChannelData(0), R = st.numberOfChannels > 1 ? st.getChannelData(1) : L;
  let sum = 0; for (let i = 0; i < N; i++) sum += (L[i] + R[i]) / 2;
  const mean = sum / N; let vr = 0;
  for (let i = 0; i < N; i++) { const d = (L[i] + R[i]) / 2 - mean; vr += d * d; }
  const std = Math.sqrt(vr / N) || 1;
  const S = 343980, hop = Math.floor(S * 0.75);
  const outL = new Float32Array(N), outR = new Float32Array(N), peso = new Float32Array(N);
  const win = new Float32Array(S);
  for (let i = 0; i < S; i++) win[i] = Math.min(i + 1, S - i) / (S / 2);
  const total = Math.ceil(Math.max(0, N - S) / hop) + 1;
  const t0 = performance.now(); let k = 0;
  for (let start = 0; ; start += hop) {
    if (cancelar) throw new Error("Cancelado");
    const len = Math.min(S, N - start), inp = new Float32Array(2 * S);
    for (let i = 0; i < len; i++) { inp[i] = (L[start + i] - mean) / std; inp[S + i] = (R[start + i] - mean) / std; }
    const res = await sess.run({ mix: new ort.Tensor("float32", inp, [1, 2, S]) });
    const d = res.stems.data, oL = 8 * S, oR = 9 * S; // stem 4 = guitarra
    for (let i = 0; i < len; i++) {
      const w = win[i];
      outL[start + i] += d[oL + i] * w; outR[start + i] += d[oR + i] * w; peso[start + i] += w;
    }
    k++; $("prog").value = k / total;
    const resta = (performance.now() - t0) / k * (total - k) / 60000;
    $("estado").textContent = "Separando la guitarra: bloque " + k + " de " + total +
      (k > 1 ? " — faltan unos " + Math.max(1, Math.round(resta)) + " min" : "");
    await new Promise(r => setTimeout(r, 0));
    if (start + S >= N) break;
  }
  const mono = new Float32Array(N);
  for (let i = 0; i < N; i++) {
    const w = peso[i] || 1;
    outL[i] = outL[i] / w * std + mean; outR[i] = outR[i] / w * std + mean;
    mono[i] = (outL[i] + outR[i]) / 2;
  }
  if (stemUrl) URL.revokeObjectURL(stemUrl);
  stemUrl = URL.createObjectURL(wavBlob(outL, outR, 44100));
  $("stem").src = stemUrl; $("stem").hidden = false;
  const ab = new AudioBuffer({ length: N, sampleRate: 44100, numberOfChannels: 1 });
  ab.copyToChannel(mono, 0);
  return remuestrear(ab, 22050, 1);
}

// ---------- Selección rápida de notas de guitarra ----------
function filtroRapido(ns) {
  if (ns.length < 8) return ns;
  const a = ns.map(n => n.amplitude).sort((x, y) => x - y);
  const thr = a[Math.floor(a.length * 0.2)];
  const k = ns.filter(n => n.amplitude >= thr).sort((x, y) => x.startTimeSeconds - y.startTimeSeconds);
  const out = []; let i = 0;
  while (i < k.length) {
    let j = i; const g = [k[i]];
    while (j + 1 < k.length && k[j+1].startTimeSeconds - k[i].startTimeSeconds < 0.07) g.push(k[++j]);
    g.sort((x, y) => y.amplitude - x.amplitude); out.push(...g.slice(0, 6)); i = j + 1;
  }
  return out;
}

// Quita notas graves "fantasma": graves muy débiles y la octava de abajo de una nota real
function limpiarFantasmas(ns) {
  const k = ns.slice().sort((a, b) => a.startTimeSeconds - b.startTimeSeconds);
  const am = k.map(n => n.amplitude || 0).sort((a, b) => a - b);
  const med = am.length ? am[Math.floor(am.length / 2)] : 0;
  return k.filter((n, i) => {
    if (n.pitchMidi < 52 && (n.amplitude || 0) < med * 0.6) return false;
    const ini = n.startTimeSeconds, fin = ini + n.durationSeconds;
    const choca = m => {
      const d = m.pitchMidi - n.pitchMidi;
      if ((d !== 12 && d !== 24) || (m.amplitude || 0) < (n.amplitude || 0) * 1.15) return false;
      const sol = Math.min(fin, m.startTimeSeconds + m.durationSeconds) - Math.max(ini, m.startTimeSeconds);
      return sol >= 0.5 * n.durationSeconds;
    };
    for (let j = i - 1; j >= 0 && k[j].startTimeSeconds >= ini - 4; j--) if (choca(k[j])) return false;
    for (let j = i + 1; j < k.length && k[j].startTimeSeconds <= fin; j++) if (choca(k[j])) return false;
    return true;
  });
}

// Une los deslizamientos (slides): las notas cortas de paso se absorben en la nota anterior
// para que el sonido no se corte, sin escribirlas como notas aparte.
function unirDeslizados(crudas, minDur, minMidi) {
  const ns = crudas.filter(n => n.pitchMidi >= minMidi && n.pitchMidi <= 88)
    .sort((a, b) => a.startTimeSeconds - b.startTimeSeconds);
  const largas = ns.filter(n => n.durationSeconds >= minDur).map(n => ({ ...n }));
  const cortas = ns.filter(n => n.durationSeconds < minDur);
  for (const k of largas) {
    let fin = k.startTimeSeconds + k.durationSeconds, ult = k.pitchMidi, algo = true;
    while (algo) {
      algo = false;
      for (const c of cortas) {
        if (c.usada) continue;
        const ini = c.startTimeSeconds;
        if (ini > fin + 0.08) break;
        if (ini >= fin - 0.03 && Math.abs(c.pitchMidi - ult) <= 4) {
          fin = Math.max(fin, ini + c.durationSeconds); ult = c.pitchMidi; c.usada = true; algo = true; break;
        }
      }
    }
    k.durationSeconds = fin - k.startTimeSeconds;
  }
  // rellenar huecos pequeños antes de la siguiente nota (hammer-on, pull-off, slide)
  for (let i = 0; i < largas.length; i++) {
    const k = largas[i], fin = k.startTimeSeconds + k.durationSeconds;
    for (let j = i + 1; j < largas.length; j++) {
      const n = largas[j];
      if (n.startTimeSeconds <= k.startTimeSeconds + 0.03) continue;
      const hueco = n.startTimeSeconds - fin;
      if (Math.abs(n.pitchMidi - k.pitchMidi) <= 12 && hueco > -0.5 && hueco < 0.1)
        k.durationSeconds = n.startTimeSeconds - k.startTimeSeconds;
      break;
    }
  }
  return largas;
}

// ---------- Transcripción ----------
$("btnTrans").onclick = async () => {
  cancelar = false; $("btnTrans").disabled = true; $("btnCancel").hidden = false;
  $("prog").hidden = false; $("prog").value = 0; $("stem").hidden = true;
  try {
    const metodo = $("metodo").value;
    let mono;
    if (metodo === "preciso") mono = await separarGuitarra();
    else {
      $("estado").textContent = "Preparando el audio...";
      mono = await remuestrear(dec, 22050, 1);
      if (metodo === "rapido") mono = await filtrarAudio(mono);
    }
    $("prog").value = 0;
    $("estado").textContent = "Detectando notas (la primera vez baja el modelo de notas)...";
    const frames = [], onsets = [], contours = [];
    const bp = new BasicPitch(MODEL);
    await bp.evaluateModel(mono.getChannelData(0),
      (f,o,c) => { frames.push(...f); onsets.push(...o); contours.push(...c); },
      p => { $("prog").value = p; });
    const onset = Math.min(0.9, Math.max(0.15, 0.8 - $("sens").value / 100));
    const frame = Math.max(0.1, onset - 0.2);
    const crudas = noteFramesToTime(addPitchBendsToNoteEvents(contours,
      outputToNotesPoly(frames, onsets, onset, frame, 3, true, null, null, true, 11)));
    let lista = limpiarFantasmas(unirDeslizados(crudas, $("minlen").value / 1000, +$("grave").value));
    if (metodo === "rapido") lista = filtroRapido(lista);
    notasFinal = lista.sort((a,b) => a.startTimeSeconds - b.startTimeSeconds);
    asignarCuerdas();
    armarPartitura();
  } catch (err) {
    if (!err || !err.message) sessDemucs = null; // la sesión pudo quedar dañada
    $("estado").textContent = (err && err.message === "Cancelado") ? "Cancelado." : msgError(err);
  }
  $("prog").hidden = true; $("btnCancel").hidden = true; $("btnTrans").disabled = false;
};

// ---------- Cuerda y traste ----------
function asignar(ns, pos) {
  const cand = ns.map(n => {
    const c = [];
    for (let s = 0; s < 6; s++) { const fr = n.pitchMidi - AFINACION[s]; if (fr >= 0 && fr <= 22) c.push({ s, fr }); }
    return c;
  });
  let best = null, bestC = 1e9; const cur = [];
  (function rec(i, usadas, costo) {
    if (costo >= bestC) return;
    if (i === ns.length) {
      const fr = cur.filter(x => x.fr > 0).map(x => x.fr);
      const span = fr.length ? Math.max(...fr) - Math.min(...fr) : 0;
      const tot = costo + span * 0.5 + (span > 4 ? (span - 4) * 3 : 0);
      if (tot < bestC) { bestC = tot; best = cur.slice(); }
      return;
    }
    for (const c of cand[i]) {
      if (usadas & (1 << c.s)) continue;
      cur[i] = c;
      rec(i + 1, usadas | (1 << c.s), costo + Math.abs(c.fr - pos) + (c.fr > 12 ? 2 : 0) + (c.fr === 0 ? -1 : 0));
    }
  })(0, 0, 0);
  return best;
}

function asignarCuerdas() {
  const grupos = [];
  for (const n of notasFinal) {
    const g = grupos[grupos.length-1];
    if (g && n.startTimeSeconds - g.t < 0.07) g.notas.push(n);
    else grupos.push({ t: n.startTimeSeconds, notas: [n] });
  }
  let pos = 5; eventos = [];
  for (const g of grupos) {
    const ns = g.notas.filter(n => AFINACION.some(b => n.pitchMidi - b >= 0 && n.pitchMidi - b <= 22))
      .sort((a, b) => (b.amplitude || 0) - (a.amplitude || 0)).slice(0, 6);
    let as = null;
    while (ns.length && !(as = asignar(ns, pos))) ns.pop();
    if (!as) continue;
    const res = ns.map((n, i) => ({ s: as[i].s, fr: as[i].fr, midi: n.pitchMidi, dur: n.durationSeconds }));
    const tr = res.filter(r => r.fr > 0).map(r => r.fr);
    if (tr.length) pos = Math.round(tr.reduce((a,b)=>a+b,0) / tr.length);
    eventos.push({ t: g.t, notas: res });
  }
}

// ---------- Tempo, compases y duraciones ----------
function detectarBpm() {
  if (eventos.length < 2) return 100;
  const t0 = eventos[0].t; let mejor = 100, mejorS = -1e9;
  for (let bpm = 70; bpm <= 160; bpm += 0.5) {
    const p = 60 / bpm / 2; let s = 0;
    for (const e of eventos) s += Math.cos(2 * Math.PI * (e.t - t0) / p);
    s = s / eventos.length - 0.0004 * Math.abs(bpm - 110);
    if (s > mejorS) { mejorS = s; mejor = bpm; }
  }
  return Math.round(mejor);
}
// [tamaño en semicorcheas, figura, ¿con puntillo?]
const PERM = [[16,"1",0],[12,"2",1],[8,"2",0],[6,"4",1],[4,"4",0],[3,"8",1],[2,"8",0],[1,"16",0]];
function piezas(l) { const o = []; while (l > 0) { const a = PERM.find(x => x[0] <= l); o.push(a); l -= a[0]; } return o; }

function construir(bpm, BAR) {
  const step = 60 / bpm / 4, t0 = eventos[0].t, q = [];
  for (const e of eventos) {
    const slot = Math.max(0, Math.round((e.t - t0) / step));
    const len = Math.max(1, Math.round(Math.max(...e.notas.map(n => n.dur)) / step));
    const last = q[q.length-1];
    if (last && last.slot === slot) {
      e.notas.forEach(n => { if (!last.notas.some(x => x.s === n.s)) last.notas.push(n); });
      last.len = Math.max(last.len, len);
    } else q.push({ slot, len, notas: e.notas.slice() });
  }
  const bars = [[]], todas = []; let pos = 0;
  function emitir(esNota, len, notas) {
    while (len > 0) {
      const l = Math.min(len, BAR - (pos % BAR));
      piezas(l).forEach((p, i) => {
        const it = { i: todas.length, pos, len: p[0], dur: p[1], pt: p[2], notas: (esNota && i === 0) ? notas : null };
        bars[bars.length-1].push(it); todas.push(it); pos += p[0];
      });
      len -= l;
      if (pos % BAR === 0) bars.push([]);
    }
  }
  q.forEach((e, i) => {
    const gap = i + 1 < q.length ? q[i+1].slot - e.slot : e.len;
    const largo = Math.max(1, Math.min(e.len, gap));
    emitir(true, largo, e.notas);
    if (gap > largo) emitir(false, gap - largo, null);
  });
  if (pos % BAR !== 0) emitir(false, BAR - (pos % BAR), null);
  return { bars: bars.filter(b => b.length), todas, step, bpm };
}

function ritmoHtml(it) {
  const c = it.dur;
  let h = '<div class="ritmo' + (it.notas ? "" : " silencio") + '">';
  if (c === "1") h += '<i class="redonda"></i>';
  else {
    h += '<i class="tallo' + (c === "2" ? " hueca" : "") + '"></i>';
    if (c === "8" || c === "16") h += '<i class="banda" style="top:2px"></i>';
    if (c === "16") h += '<i class="banda" style="top:8px"></i>';
  }
  if (it.pt) h += "<b>•</b>";
  return h + "</div>";
}

function dibujar(r) {
  let h = "";
  r.bars.forEach((bar, n) => {
    h += '<div class="compas"><div class="num">compás ' + (n + 1) + '</div><div class="fila2"><div class="cuerdas">' +
      NOMBRES.map(x => "<span>" + x + "</span>").join("") + "</div>";
    bar.forEach(it => {
      h += '<div class="col" id="c' + it.i + '" style="width:' + (20 + it.len * 7) + 'px">';
      for (let row = 0; row < 6; row++) {
        const nota = it.notas && it.notas.find(x => x.s === 5 - row);
        h += "<span>" + (nota ? nota.fr : "&nbsp;") + "</span>";
      }
      h += ritmoHtml(it) + "</div>";
    });
    h += "</div></div>";
  });
  $("tab").innerHTML = h;
}

function armarPartitura() {
  if (!eventos.length) { $("estado").textContent = "No se detectaron notas. Sube la sensibilidad."; return; }
  const BAR = +$("comp").value;
  const manual = parseFloat($("bpm").value);
  const bpm = manual > 0 ? Math.round(manual) : detectarBpm();
  ultimo = construir(bpm, BAR);
  dibujar(ultimo);
  ["btnPlay","btnStop","btnMidi"].forEach(i => $(i).disabled = false);
  $("estado").textContent = notasFinal.length + " notas, " + ultimo.bars.length + " compases. Tempo usado: " + bpm + " BPM.";
}
$("bpm").onchange = () => { if (eventos.length) armarPartitura(); };
$("comp").onchange = () => { if (eventos.length) armarPartitura(); };

// ---------- Reproductor ----------
function tocarNota(midi, t, dur) {
  const o = actx.createOscillator(), g = actx.createGain(), fl = actx.createBiquadFilter();
  o.type = "sawtooth"; o.frequency.value = 440 * Math.pow(2, (midi - 69) / 12);
  fl.type = "lowpass"; fl.frequency.setValueAtTime(3000, t); fl.frequency.exponentialRampToValueAtTime(500, t + 0.4);
  const d = Math.min(Math.max(dur, 0.25), 1.5);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.25, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(fl); fl.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + d + 0.05);
}
function detener() {
  timers.forEach(clearTimeout); timers = [];
  if (actx) { actx.close(); actx = null; }
  document.querySelectorAll(".col.on").forEach(c => c.classList.remove("on"));
}
$("btnStop").onclick = detener;
$("btnPlay").onclick = () => {
  if (!ultimo) return;
  detener(); actx = new (window.AudioContext || window.webkitAudioContext)();
  const t0 = actx.currentTime + 0.2, step = ultimo.step;
  ultimo.todas.forEach(it => {
    if (!it.notas) return;
    it.notas.forEach(n => tocarNota(n.midi, t0 + it.pos * step, it.len * step));
    timers.push(setTimeout(() => {
      document.querySelectorAll(".col.on").forEach(c => c.classList.remove("on"));
      const c = $("c" + it.i); if (c) { c.classList.add("on"); c.scrollIntoView({ block: "nearest" }); }
    }, (0.2 + it.pos * step) * 1000));
  });
  const fin = ultimo.todas.length ? (ultimo.todas[ultimo.todas.length-1].pos + 4) * step : 0;
  timers.push(setTimeout(detener, (0.5 + fin) * 1000));
};

// ---------- Exportar MIDI ----------
function vlq(v) { const b = [v & 127]; while ((v >>= 7)) b.unshift((v & 127) | 128); return b; }
$("btnMidi").onclick = () => {
  if (!ultimo) return;
  const ev = [];
  ultimo.todas.forEach(it => { if (it.notas) it.notas.forEach(n => {
    ev.push([it.pos * 120, 0x90, n.midi, 90], [(it.pos + it.len) * 120, 0x80, n.midi, 0]);
  }); });
  ev.sort((a,b) => a[0] - b[0] || a[1] - b[1]);
  const us = Math.round(60000000 / ultimo.bpm);
  let trk = [0, 0xFF, 0x51, 3, (us >> 16) & 255, (us >> 8) & 255, us & 255], ult = 0;
  ev.forEach(x => { trk.push(...vlq(x[0] - ult), x[1], x[2], x[3]); ult = x[0]; });
  trk.push(0, 0xFF, 0x2F, 0);
  const h = [0x4D,0x54,0x68,0x64,0,0,0,6,0,0,0,1,0x01,0xE0];
  const L = trk.length, tr = [0x4D,0x54,0x72,0x6B,(L>>24)&255,(L>>16)&255,(L>>8)&255,L&255];
  const blob = new Blob([new Uint8Array([...h, ...tr, ...trk])], { type: "audio/midi" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "tablatura.mid"; a.click();
};
</script>
